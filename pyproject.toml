[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-manager"
version = "0.0.7"
description = "Python package for managing Shopify uploads"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Your Name", email = "you@example.com" } ]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/yourusername/shopify_manager"
